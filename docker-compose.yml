services:
  api:
    build: ./api
    container_name: api
    environment:
      API_PORT: "5000"
      STORE_URL: http://store:6000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 5
    depends_on:
      store:
        condition: service_healthy
    networks:
      - backend

  store:
    build: ./store
    container_name: store
    environment:
      STORE_PORT: "6000"
    expose:
      - "6000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6000/health')"]
      interval: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
