name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, store]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: microservicios-py-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: docker compose up (smoke test)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Start services
        run: docker compose up --build -d --wait

      - name: Round trip api -> store
        run: |
          curl -fsS -X POST http://localhost:5000/action/save \
               -H "Content-Type: application/json" -d '{"ci":"ok"}'
          curl -fsS http://localhost:5000/action/list | grep '"ci":"ok"'

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
