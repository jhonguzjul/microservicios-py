name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait

      - name: Test save and list
        run: |
          curl -fsS -X POST http://localhost:5000/action/save -H "Content-Type: application/json" -d '{"ci":"ok"}'
          curl -fsS http://localhost:5000/action/list | grep '"ci":"ok"'

      - name: Stop services
        if: always()
        run: docker compose down
